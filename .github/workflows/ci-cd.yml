name: CI/CD Pipeline

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'LICENSE'
  pull_request:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'LICENSE'

jobs:
  ci:
    name: Continuous Integration (Tests & Lint)
    runs-on: ubuntu-latest

    env:
      # Dummy values so modules can import without crashing.
      # All real I/O is mocked inside the test suite.
      DATABASE_URL: "sqlite:///./test.db"
      GROQ_API_KEY: "ci-dummy-key"
      TELEGRAM_BOT_TOKEN: "0000000000:ci-dummy-token"
      TELEGRAM_ALLOWED_CHAT_ID: "123456789"
      EMBED_SERVER_URL: "http://localhost:8080"
      API_KEY: "ci-dummy-api-key"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Add uv to PATH
        run: echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Cache uv dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: ${{ runner.os }}-uv-${{ hashFiles('**/uv.lock') }}
          restore-keys: |
            ${{ runner.os }}-uv-

      - name: Install Dependencies
        run: uv sync

      - name: Format check
        run: uv run ruff format --check .

      - name: Lint with Ruff
        run: uv run ruff check .

      - name: Type check
        run: uv run mypy src tests

      - name: Run Tests
        run: uv run pytest tests/ -v --tb=short

  cd:
    name: Continuous Deployment (Ubuntu Cloud Instance)
    runs-on: ubuntu-latest
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Deploy to Ubuntu VM via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: vishnu
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: |
            cd /home/vishnu/worklab/praxisiq
            chmod +x scripts/deploy.sh
            ./scripts/deploy.sh
