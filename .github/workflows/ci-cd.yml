name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  ci:
    name: Continuous Integration (Tests)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Add uv to PATH
        run: echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Set up uv Cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: ${{ runner.os }}-uv-${{ hashFiles('**/uv.lock') }}
          restore-keys: |
            ${{ runner.os }}-uv-

      - name: Install Dependencies
        run: uv sync

      - name: Run Tests
        run: uv run pytest tests/ -v

  cd:
    name: Continuous Deployment (Ubuntu Cloud Instance)
    runs-on: ubuntu-latest
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Deploy to Ubuntu VM via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: vishnu
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: |
            cd /home/vishnu/worklab/praxisiq
            git pull origin main
            uv sync --frozen
            
            # Copy systemd service files to user systemd directory
            mkdir -p ~/.config/systemd/user/
            cp /home/vishnu/worklab/praxisiq/config/systemd/* ~/.config/systemd/user/ 2>/dev/null || true
            
            # Reload daemon and restart services
            systemctl --user daemon-reload
            systemctl --user enable praxisiq-api.service praxisiq-collector.service praxisiq-weekly.timer praxisiq-embed.service
            systemctl --user restart praxisiq-api.service praxisiq-collector.service praxisiq-weekly.timer praxisiq-embed.service
